# Data Configuration
data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  external_path: "data/external"
  
  # Weather data schema
  weather_features:
    - temperature
    - humidity
    - wind_speed
    - rainfall
    
  # Data generation parameters
  simulation:
    n_samples: 1000
    random_seed: 42
    temperature:
      mean: 25.0
      std: 5.0
    humidity:
      mean: 60.0
      std: 10.0
    wind_speed:
      mean: 10.0
      std: 2.0
    rainfall:
      mean: 2.0
      std: 1.5

# Model Configuration
model:
  # Training parameters
  train_test_split: 0.2
  random_seed: 42
  
  # Model types to train
  models:
    - "linear_regression"
    - "random_forest"
    - "xgboost"
    - "neural_network"
  
  # Neural network parameters
  neural_network:
    hidden_layers: [64, 32]
    activation: "relu"
    optimizer: "adam"
    loss: "mse"
    epochs: 100
    batch_size: 32
    learning_rate: 0.001
    early_stopping:
      patience: 10
      monitor: "val_loss"
  
  # XGBoost parameters
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

# Evaluation Configuration
evaluation:
  metrics:
    regression:
      - "rmse"
      - "mae"
      - "r2"
      - "smape"
      - "mase"
    classification:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1"
  
  # Cross-validation
  cv_folds: 5
  cv_strategy: "time_series_split"
  
  # Model comparison
  create_leaderboard: true
  save_predictions: true

# Visualization Configuration
visualization:
  # Plot settings
  figure_size: [12, 8]
  dpi: 300
  style: "seaborn-v0_8"
  
  # Color schemes
  colors:
    primary: "#1f77b4"
    secondary: "#ff7f0e"
    tertiary: "#2ca02c"
    quaternary: "#d62728"
  
  # Map settings
  map:
    center_lat: 40.7128
    center_lon: -74.0060
    zoom: 10
    tiles: "OpenStreetMap"
  
  # Time series plots
  time_series:
    show_confidence_intervals: true
    confidence_level: 0.95
    forecast_horizon: 7  # days

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/weather_forecasting.log"
  
# Device Configuration
device:
  # Auto-detect: cuda -> mps -> cpu
  auto_detect: true
  fallback: "cpu"
  
# Demo Configuration
demo:
  streamlit:
    port: 8501
    host: "localhost"
    theme: "light"
  
  # Sample data for demo
  sample_size: 100
  show_uncertainty: true
  enable_map: true
